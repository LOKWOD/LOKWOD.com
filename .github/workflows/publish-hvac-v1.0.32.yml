name: Publish HVAC v1.0.32

on:
  push:
    paths:
      - ".github/workflows/publish-hvac-v1.0.32.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download verified OTA bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-a720-822f-847d-227407f79c35/raw?se=2026-08-20T05%3A26%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=c122e518-0de5-40fd-b5cb-4335c09049fd&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-19T23%3A49%3A29Z&ske=2026-08-20T23%3A49%3A29Z&sks=b&skv=2026-02-06&sig=2wA9H5%2BU2wzYuL6jKuqcGEUB0VfaBIOJ3JQ%2BfDRPQvY%3D' -o /tmp/hvac-v1.0.32.zip
          rm -rf /tmp/hvac-v1.0.32
          mkdir -p /tmp/hvac-v1.0.32
          unzip -q /tmp/hvac-v1.0.32.zip -d /tmp/hvac-v1.0.32
          cd /tmp/hvac-v1.0.32
          sha256sum -c LOKWOD_HVAC_Controller-1.0.32.bin.sha256

      - name: Publish firmware and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hvac/stable
          cp /tmp/hvac-v1.0.32/LOKWOD_HVAC_Controller-1.0.32.bin hvac/stable/
          cp /tmp/hvac-v1.0.32/manifest.json hvac/stable/manifest.json
          cp /tmp/hvac-v1.0.32/manifest-1.0.32.json hvac/stable/

          git config user.name "LOKWOD Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add hvac/stable
          git commit -m "Publish HVAC firmware v1.0.32"
          git push

# Trigger publication after workflow registration
