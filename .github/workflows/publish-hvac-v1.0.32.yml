name: Publish HVAC v1.0.32

on:
  push:
    paths:
      - ".github/workflows/publish-hvac-v1.0.32.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hvac-v1.0.32
          cat .release-staging/hvac-1.0.32/part-*.b64 |
            base64 --decode > /tmp/hvac-v1.0.32/LOKWOD_HVAC_Controller-1.0.32.bin
          echo "c6eacd54e1f166c218e0db73488bfef503f4edfc795eb39bdf233e586a3a1bd3  /tmp/hvac-v1.0.32/LOKWOD_HVAC_Controller-1.0.32.bin" |
            sha256sum --check -
          test "$(stat -c %s /tmp/hvac-v1.0.32/LOKWOD_HVAC_Controller-1.0.32.bin)" = "1961472"

      - name: Publish firmware and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hvac/stable
          cp /tmp/hvac-v1.0.32/LOKWOD_HVAC_Controller-1.0.32.bin hvac/stable/

          cat > hvac/stable/manifest.json <<'EOF'
          {
            "version": "1.0.32",
            "firmware_url": "https://lokwod.com/hvac/stable/LOKWOD_HVAC_Controller-1.0.32.bin",
            "size": 1961472,
            "build_date": "2026-08-20",
            "release_notes": "Outdoor AQI and UV forecast on the local HVAC dashboard, with severity guidance and safer automatic release packaging.",
            "sha256": "c6eacd54e1f166c218e0db73488bfef503f4edfc795eb39bdf233e586a3a1bd3",
            "hardware": "P4-4B-R1",
            "channel": "stable"
          }
          EOF
          cp hvac/stable/manifest.json hvac/stable/manifest-1.0.32.json

          git config user.name "LOKWOD Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add hvac/stable
          git commit -m "Publish HVAC firmware v1.0.32"
          git push
