name: Publish HVAC v1.0.34

on:
  push:
    paths:
      - ".github/workflows/publish-hvac-v1.0.34.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hvac-v1.0.34
          cat .release-staging/hvac-1.0.34/part-*.b64 |
            base64 --decode > /tmp/hvac-v1.0.34/LOKWOD_HVAC_Controller-1.0.34.bin
          echo "6023d6b2a4077eb149eb707c70644085c461c5fca967aab69efd5f55c1ce4abe  /tmp/hvac-v1.0.34/LOKWOD_HVAC_Controller-1.0.34.bin" |
            sha256sum --check -
          test "$(stat -c %s /tmp/hvac-v1.0.34/LOKWOD_HVAC_Controller-1.0.34.bin)" = "1964992"

      - name: Publish firmware and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hvac/stable
          cp /tmp/hvac-v1.0.34/LOKWOD_HVAC_Controller-1.0.34.bin hvac/stable/

          cat > hvac/stable/manifest.json <<'EOF'
          {
            "version": "1.0.34",
            "firmware_url": "https://lokwod.com/hvac/stable/LOKWOD_HVAC_Controller-1.0.34.bin",
            "size": 1964992,
            "build_date": "2026-08-24",
            "release_notes": "Averages local and remote room temperatures with automatic single-sensor fallback, plus remote BMP280 pressure and per-sensor health on the web dashboard.",
            "sha256": "6023d6b2a4077eb149eb707c70644085c461c5fca967aab69efd5f55c1ce4abe",
            "hardware": "P4-4B-R1",
            "channel": "stable"
          }
          EOF
          cp hvac/stable/manifest.json hvac/stable/manifest-1.0.34.json

          git config user.name "LOKWOD Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add hvac/stable
          git commit -m "Publish HVAC firmware v1.0.34"
          git push
