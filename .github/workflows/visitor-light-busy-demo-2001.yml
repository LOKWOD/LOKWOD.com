name: 20-second busy visitor light demo

on:
  push:
    paths:
      - .github/workflows/visitor-light-busy-demo-2001.yml

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate busy traffic across all sites
        shell: bash
        run: |
          set -euo pipefail
          WORKER='https://lokwod-visitor-beacon.syracuseappraiser.workers.dev'

          sites=(
            'nautical-dream|https://nauticaldream.com|/thousand-islands-guide.html|Thousand Islands Boating Guide'
            'lokwod|https://lokwod.com|/products/well-monitor|LOKWOD Well Monitor'
            'life-in-the-simulation|https://lifeinthesimulation.com|/|Life in the Simulation'
            'beautiful-mens-club|https://beautifulmensclub.com|/|Beautiful Mens Club'
            'mr-adventure-dad|https://mradventuredad.com|/|Mr Adventure Dad'
            'syracuse-appraiser|https://syracuseappraiser.com|/|Syracuse Appraiser'
            'accurate-re-appraisals|https://accuratereappraisals.com|/|Accurate Real Estate Appraisals'
          )

          for i in $(seq 1 20); do
            entry="${sites[$(( (i-1) % ${#sites[@]} ))]}"
            IFS='|' read -r site origin path title <<< "$entry"
            ua="Mozilla/5.0 LOKWODBusyDemo/${i} Chrome/140.0"
            payload=$(printf '{"site":"%s","path":"%s?busy=%02d","title":"%s"}' "$site" "$path" "$i" "$title")
            status="$(curl --silent --show-error --max-time 10 --output /tmp/visitor-response --write-out '%{http_code}' --request POST "$WORKER/v1/hit" --user-agent "$ua" --header "Origin: $origin" --header 'Content-Type: text/plain;charset=UTF-8' --data-raw "$payload")"
            echo "[$i/20] $site -> HTTP $status"
            test "$status" = '204' || { cat /tmp/visitor-response; exit 1; }
            sleep 1
          done

          echo '20-second busy visitor demo complete.'
