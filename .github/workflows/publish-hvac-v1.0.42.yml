name: Publish HVAC v1.0.42

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-hvac-v1.0.42.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hvac-v1.0.42
          cat .release-staging/hvac-1.0.42/part-*.b64 |
            base64 --decode > /tmp/hvac-v1.0.42/LOKWOD_HVAC_Controller-1.0.42.bin
          echo "2a6631e563af454bf22261621d1593ba9fc2095f01abd78ca31caf72f8054dec  /tmp/hvac-v1.0.42/LOKWOD_HVAC_Controller-1.0.42.bin" |
            sha256sum --check -
          test "$(stat -c %s /tmp/hvac-v1.0.42/LOKWOD_HVAC_Controller-1.0.42.bin)" = "1971568"

      - name: Publish firmware and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hvac/stable
          cp /tmp/hvac-v1.0.42/LOKWOD_HVAC_Controller-1.0.42.bin hvac/stable/

          cat > hvac/stable/manifest.json <<'EOF'
          {
            "version": "1.0.42",
            "firmware_url": "https://lokwod.com/hvac/stable/LOKWOD_HVAC_Controller-1.0.42.bin",
            "size": 1971568,
            "build_date": "2026-09-01",
            "release_notes": "Automatically stages fan speed from the live setpoint differential in heating and cooling: speed 1 up to 0.5 F, speed 2 through 1.0 F, and speed 3 above 1.0 F, with anti-chatter hysteresis and a relay-safe 100 ms break between live speed changes.",
            "sha256": "2a6631e563af454bf22261621d1593ba9fc2095f01abd78ca31caf72f8054dec",
            "hardware": "P4-4B-R1",
            "channel": "stable"
          }
          EOF
          cp hvac/stable/manifest.json hvac/stable/manifest-1.0.42.json
          echo "2a6631e563af454bf22261621d1593ba9fc2095f01abd78ca31caf72f8054dec  LOKWOD_HVAC_Controller-1.0.42.bin" > hvac/stable/LOKWOD_HVAC_Controller-1.0.42.bin.sha256

          git config user.name "LOKWOD Release Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .release-staging/hvac-1.0.42
          git rm .github/workflows/publish-hvac-v1.0.42.yml
          git add -A
          git commit -m "Publish HVAC firmware v1.0.42"
          git push
