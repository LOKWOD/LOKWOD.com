name: Capture exact live LOKWOD.com site

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/capture-live-site.yml
      - .github/scripts/capture-live-site.sh

permissions:
  contents: write

concurrency:
  group: capture-live-lokwod-site
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl

      - name: Capture the verified original live site
        run: bash .github/scripts/capture-live-site.sh
