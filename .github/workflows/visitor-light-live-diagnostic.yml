# Post-DNS restoration verification
name: LOKWOD backend restoration verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/visitor-light-live-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live backend, protected routes, and visitor beacon
        shell: bash
        run: |
          set -u -o pipefail
          WORKER='https://lokwod-visitor-beacon.syracuseappraiser.workers.dev'

          echo '=== DNS ==='
          echo 'NS:'; dig +short NS lokwod.com
          echo 'A:'; dig +short A lokwod.com
          echo 'www CNAME:'; dig +short CNAME www.lokwod.com

          probe() {
            path="$1"
            out=$(mktemp); hdr=$(mktemp)
            code=$(curl -sS --max-time 20 -D "$hdr" -o "$out" -w '%{http_code}' "https://lokwod.com$path" || true)
            echo "--- $path -> HTTP $code bytes=$(wc -c < "$out" 2>/dev/null || echo 0) ---"
            grep -iE '^(location|server|content-type|set-cookie):' "$hdr" | head -12 || true
            if grep -Fq "$WORKER/beacon.js" "$out"; then echo 'VISITOR_BEACON=present'; else echo 'VISITOR_BEACON=missing'; fi
            if grep -Fq 'data-site="lokwod"' "$out"; then echo 'VISITOR_SITE_ID=present'; else echo 'VISITOR_SITE_ID=missing'; fi
          }

          for p in / /login /portal '/signin-with-chatgpt?return_to=%2Fportal' /admin /admin/login /firmware /support /beta; do probe "$p"; done

          echo '=== Visitor Worker health ==='
          curl -fsS --max-time 15 "$WORKER/health" || true
          echo
          payload='{"site":"lokwod","path":"/__restoration-check","title":"LOKWOD restoration check"}'
          status=$(curl -sS --max-time 15 -o /tmp/hit-response -w '%{http_code}' -X POST "$WORKER/v1/hit" -H 'Origin: https://lokwod.com' -H 'Content-Type: text/plain;charset=UTF-8' --data-raw "$payload" || true)
          echo "Visitor synthetic hit -> HTTP $status"
