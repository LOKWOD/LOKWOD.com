name: LOKWOD backend comparison

on:
  pull_request:
    paths:
      - .github/workflows/visitor-light-live-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare GitHub Pages with previous Cloudflare app
        shell: bash
        run: |
          set -u -o pipefail
          echo '=== STATIC REPO: dashboard-only chunks referenced by main bundle ==='
          curl -fsSL 'https://raw.githubusercontent.com/LOKWOD/LOKWOD.com/main/assets/index-B4JheyJl.js' -o /tmp/main.js
          grep -oE 'assets/[A-Za-z0-9_.-]+\.js' /tmp/main.js | sort -u | grep -E 'portal|fleet|plan|password|admin|sign-out|support|beta' || true

          echo '=== STATIC REPO: which referenced dashboard chunks actually exist ==='
          for f in password-form-ByFkEbCB.js fleet-explorer-CcRs--a4.js plan-control-B90fg5sr.js portal-client-_LjjmoS0.js admin-login-form-BArNTL61.js sign-out-DCtjIMSg.js support-form-DQKCUVCd.js beta-form-CSit1qBe.js; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://raw.githubusercontent.com/LOKWOD/LOKWOD.com/main/assets/$f")
            echo "$f -> $code"
          done

          probe() {
            label="$1"; ip="$2"; path="$3"
            out="/tmp/${label//[^a-zA-Z0-9]/_}.body"
            hdr="/tmp/${label//[^a-zA-Z0-9]/_}.hdr"
            if [ -n "$ip" ]; then
              code=$(curl -k -sS --max-time 20 --resolve "lokwod.com:443:$ip" -D "$hdr" -o "$out" -w '%{http_code}' "https://lokwod.com$path" || true)
            else
              code=$(curl -sS --max-time 20 -D "$hdr" -o "$out" -w '%{http_code}' "https://lokwod.com$path" || true)
            fi
            echo "--- $label $path -> HTTP $code bytes=$(wc -c < "$out" 2>/dev/null || echo 0) ---"
            grep -iE '^(location|server|content-type|set-cookie):' "$hdr" | head -20 || true
            grep -oE 'assets/[A-Za-z0-9_.-]+\.js' "$out" | sort -u | grep -E 'portal|fleet|plan|password|admin|sign-out|support|beta' || true
            grep -oE '/api/[A-Za-z0-9_./?=&%-]+' "$out" | sort -u | head -50 || true
          }

          echo '=== CURRENT GITHUB-PAGES ROUTES ==='
          for p in / /login /portal '/signin-with-chatgpt?return_to=%2Fportal' /admin /admin/login /api/auth/session /api/status; do
            probe current '' "$p"
          done

          echo '=== PREVIOUS CLOUDFLARE/CHATGPT APP VIA OLD EDGE IP 162.159.143.30 ==='
          for p in / /login /portal '/signin-with-chatgpt?return_to=%2Fportal' /admin /admin/login /api/auth/session /api/status; do
            probe oldcf 162.159.143.30 "$p"
          done

          echo '=== PREVIOUS CLOUDFLARE/CHATGPT APP VIA OLD EDGE IP 172.66.3.26 ==='
          for p in /portal /admin /api/auth/session; do
            probe oldcf2 172.66.3.26 "$p"
          done
