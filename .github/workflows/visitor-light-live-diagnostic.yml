name: LOKWOD DNS diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/visitor-light-live-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve authoritative DNS and compare hosting
        shell: bash
        run: |
          set -euo pipefail
          echo '=== LOKWOD.COM DNS ==='
          dig +short NS lokwod.com
          echo '--- apex A ---'
          dig +short A lokwod.com
          echo '--- apex AAAA ---'
          dig +short AAAA lokwod.com
          echo '--- www CNAME ---'
          dig +short CNAME www.lokwod.com
          echo '--- www A ---'
          dig +short A www.lokwod.com
          echo '=== NAUTICALDREAM.COM DNS (comparison) ==='
          dig +short NS nauticaldream.com
          echo '--- apex A ---'
          dig +short A nauticaldream.com
          echo '=== LIVE SERVER HEADERS ==='
          curl -sSI https://lokwod.com/ | sed -n '1,30p'
          echo '--- Nautical Dream ---'
          curl -sSI https://nauticaldream.com/ | sed -n '1,30p'
