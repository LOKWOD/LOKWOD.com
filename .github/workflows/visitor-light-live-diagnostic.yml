name: Visitor Light live diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/visitor-light-live-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check live beacon markup, hosting, and Worker
        shell: bash
        run: |
          set -u -o pipefail
          WORKER='https://lokwod-visitor-beacon.syracuseappraiser.workers.dev'
          failures=0

          echo '=== Worker health ==='
          if curl --fail --silent --show-error --max-time 15 "$WORKER/health"; then
            echo
            echo 'Worker health OK'
          else
            echo 'Worker health FAILED'
            failures=$((failures+1))
          fi

          check_site() {
            host="$1"
            url="$2"
            site="$3"
            tmp="$(mktemp)"
            echo "=== DNS $host ==="
            getent ahostsv4 "$host" | awk '{print $1}' | sort -u || true
            echo "=== HEADERS $url ==="
            curl --silent --show-error --location --head --max-time 20 "$url" | sed -n '1,80p' || true
            echo "=== HTML $url ==="
            if ! curl --fail --silent --show-error --location --max-time 20 "$url" -o "$tmp"; then
              echo "Live page fetch FAILED for $site"
              failures=$((failures+1))
              return
            fi
            echo "bytes=$(wc -c < "$tmp") sha256=$(sha256sum "$tmp" | awk '{print $1}')"
            if grep -Fq "$WORKER/beacon.js" "$tmp"; then
              echo 'Worker script URL present'
            else
              echo 'Worker script URL MISSING'
              failures=$((failures+1))
            fi
            if grep -Fq "data-site=\"$site\"" "$tmp"; then
              echo "data-site=$site present"
            else
              echo "data-site=$site MISSING"
              failures=$((failures+1))
            fi
          }

          check_site 'lokwod.com' 'https://lokwod.com/' 'lokwod'
          check_site 'nauticaldream.com' 'https://nauticaldream.com/' 'nautical-dream'

          hit() {
            origin="$1"
            site="$2"
            path="$3"
            payload="{\"site\":\"$site\",\"path\":\"$path\",\"title\":\"Visitor Light live diagnostic\"}"
            status="$(curl --silent --show-error --max-time 15 --output /tmp/visitor-response --write-out '%{http_code}' --request POST "$WORKER/v1/hit" --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36' --header "Origin: $origin" --header 'Content-Type: text/plain;charset=UTF-8' --data-raw "$payload" || true)"
            echo "$site synthetic hit -> HTTP $status"
            if [ "$status" != '204' ]; then
              cat /tmp/visitor-response || true
              failures=$((failures+1))
            fi
          }

          hit 'https://lokwod.com' 'lokwod' '/__visitor-light-diagnostic'
          sleep 2
          hit 'https://nauticaldream.com' 'nautical-dream' '/__visitor-light-diagnostic'

          echo "Diagnostic failures: $failures"
          test "$failures" -eq 0
